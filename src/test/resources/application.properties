APP_NAME=ministreaming-test
spring.application.name=ministreaming-test

POSTGRES_PORT=5432
POSTGRES_DB=testdb
POSTGRES_USER=sa
POSTGRES_PASSWORD=

MINIO_BUCKET=test-bucket
MINIO_USER=minioadmin
MINIO_PASSWORD=minioadmin

RABBITMQ_PORT=5672
RABBITMQ_USER=guest
RABBITMQ_PASSWORD=guest

JWT_SECRET=test-jwt-secret-key-at-least-32-chars
JWT_EXPIRATION=86400000

spring.datasource.url=jdbc:h2:mem:ministreaming;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

minio.url=http://127.0.0.1:9000
minio.public-url=http://127.0.0.1:9000
minio.bucket=test-bucket
minio.access-key=minioadmin
minio.secret-key=minioadmin

security.jwt.secret=test-jwt-secret-key-at-least-32-chars
security.jwt.expiration=86400000

spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.listener.simple.auto-startup=false
