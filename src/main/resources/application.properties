spring.application.name=${APP_NAME}

# Postgres
spring.datasource.url=jdbc:postgresql://postgres:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MinIO
minio.url=${MINIO_URL}
minio.public-url=${MINIO_PUBLIC_URL}
minio.video-bucket=${MINIO_VIDEO_BUCKET}
minio.avatar-bucket=${MINIO_AVATAR_BUCKET}
minio.thumbnail-bucket=${MINIO_THUMBNAILS_BUCKET}
minio.access-key=${MINIO_USER}
minio.secret-key=${MINIO_PASSWORD}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-retries=10
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.template.retry.enabled=true
# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION}

# Multipart
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Redis
spring.data.redis.host=redis
spring.data.redis.port=${REDIS_PORT}