worker_processes  1;

events {
    worker_connections 1024;
}

http {

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
     client_max_body_size 500m;
    upstream app_upstream {
        server app:8080;
    }

    upstream minio_upstream {
        server minio:9000;
    }

    upstream minio_console_upstream {
        server minio:9001;
    }

    server {
        listen 80;
        server_name localhost;

        access_log /var/log/nginx/access.log;
	# =========================
        # API - Spring Boot
        # =========================
        location /api/ {
            proxy_pass http://app_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # =========================
        # Videos - MinIO (S3) via reverse proxy
        # =========================
        location /videos/ {
            # encaminha diretamente para o MinIO
            proxy_pass http://minio_upstream;

            # NÃO altere o host que chega no MinIO
            proxy_set_header Host minio:9000;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;



            # optional: habilita streaming parcial
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =========================
        # MinIO Console
        # =========================
        location /minio-console/ {
            proxy_pass http://minio_console_upstream/;
            proxy_set_header Host $host;
        }
    }
}
